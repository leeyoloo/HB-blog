# Decap CMS 配置
# leeyoloblog.pages.dev

backend:
  name: github
  repo: leeyoloo/HB-blog
  branch: main
  base_url: https://decap-oauth.2421526176.workers.dev
  auth_endpoint: auth

media_folder: "apps/gkBlog/public/assets/images/blog"
public_folder: "/assets/images/blog"

collections:
  - name: "blog"
    label: "博客文章"
    folder: "apps/gkBlog/src/pages/blog"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    fields:
      - label: "标题"
        name: "title"
        widget: "string"
      - label: "发布日期"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - label: "语言"
        name: "lang"
        widget: "select"
        options:
          - label: "简体中文"
            value: "zh"
          - label: "English"
            value: "en"
        default: "zh"
      - label: "标签"
        name: "tags"
        widget: "list"
        allow_add: true
      - label: "分类"
        name: "category"
        widget: "string"
        required: false
      - label: "描述"
        name: "description"
        widget: "text"
        required: false
      - label: "封面图"
        name: "cover"
        widget: "image"
        required: false
      - label: "布局"
        name: "layout"
        widget: "hidden"
        default: "Post"
      - label: "正文"
        name: "body"
        widget: "markdown"
